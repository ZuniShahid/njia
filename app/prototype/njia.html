<title>Njia Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark navigation rail · working center · quiet context panel (stacks under the center on tablets; nav becomes a bottom bar on phones) */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --subtle:#E9EEEC; --line:#DFE5E2; --line-strong:#C3CDC9;
  --ink:#13211F; --muted:#5A6A67; --nav:#10201E; --nav-2:#1C312E; --nav-ink:#EEF2F0; --nav-muted:#93A7A3;
  --brand:#0E5E57; --brand-soft:#DDEDEA; --on-brand:#FFFFFF; --accent:#E08A22; --accent-soft:#FCEFD9;
  --ok:#2F8F5B; --ok-soft:#E0F1E7; --warn:#B86A12; --warn-soft:#FBEEDB; --bad:#C2483B; --bad-soft:#F8E4E1; --info:#3B6FD8; --info-soft:#E6EDFB;
  --p1:#2F8F5B; --p1s:#E0F1E7; --p2:#3B6FD8; --p2s:#E6EDFB; --p3:#7A5AF8; --p3s:#EEEAFE; --p4:#D97E12; --p4s:#FCEFD9; --p5:#D9467A; --p5s:#FBE7EF; --p6:#0E5E57; --p6s:#DDEDEA;
  --scrim:rgba(8,17,15,.45); --shadow:0 16px 40px rgba(16,32,30,.16);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1716; --surface:#15211F; --subtle:#1E2D2A; --line:#263734; --line-strong:#36504B;
  --ink:#E8EFEC; --muted:#9AAFAA; --nav:#08110F; --nav-2:#15231F; --nav-ink:#EEF2F0; --nav-muted:#7F948F;
  --brand:#4DB3A6; --brand-soft:#173A35; --on-brand:#06201C; --accent:#F0A548; --accent-soft:#3A2A14;
  --ok:#5CC28A; --ok-soft:#163626; --warn:#E9A24F; --warn-soft:#3A2A14; --bad:#EE7A6C; --bad-soft:#3B1E1A; --info:#7EA4F2; --info-soft:#1B2843;
  --p1:#5CC28A; --p1s:#163626; --p2:#7EA4F2; --p2s:#1B2843; --p3:#A893FF; --p3s:#2A2350; --p4:#F0A548; --p4s:#3A2A14; --p5:#F07AA3; --p5s:#3D1C29; --p6:#4DB3A6; --p6s:#173A35;
  --scrim:rgba(0,0,0,.6); --shadow:0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1716; --surface:#15211F; --subtle:#1E2D2A; --line:#263734; --line-strong:#36504B;
  --ink:#E8EFEC; --muted:#9AAFAA; --nav:#08110F; --nav-2:#15231F; --nav-ink:#EEF2F0; --nav-muted:#7F948F;
  --brand:#4DB3A6; --brand-soft:#173A35; --on-brand:#06201C; --accent:#F0A548; --accent-soft:#3A2A14;
  --ok:#5CC28A; --ok-soft:#163626; --warn:#E9A24F; --warn-soft:#3A2A14; --bad:#EE7A6C; --bad-soft:#3B1E1A; --info:#7EA4F2; --info-soft:#1B2843;
  --p1:#5CC28A; --p1s:#163626; --p2:#7EA4F2; --p2s:#1B2843; --p3:#A893FF; --p3s:#2A2350; --p4:#F0A548; --p4s:#3A2A14; --p5:#F07AA3; --p5s:#3D1C29; --p6:#4DB3A6; --p6s:#173A35;
  --scrim:rgba(0,0,0,.6); --shadow:0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
.over{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;color:var(--muted)}
.lab{font-size:12px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.nav{background:var(--nav);color:var(--nav-ink);padding:20px 12px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 16px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#13211F;display:grid;place-items:center;font-weight:800;flex:none}
.word{font-size:18px;font-weight:700}
.goal-sw{display:flex;align-items:center;gap:8px;background:var(--nav-2);border:0;border-radius:10px;padding:10px 12px;text-align:left;color:var(--nav-ink);width:100%}
.goal-sw .over{color:var(--nav-muted)}
.goal-sw b{display:block;font-size:12px;font-weight:600;line-height:1.35}
.goal-sw:hover{outline:1px solid var(--nav-muted)}
.grp{padding:16px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--nav-muted)}
.ni{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:none;border:0;color:var(--nav-muted);text-align:left;width:100%;text-decoration:none}
.ni svg{width:18px;height:18px;flex:none}
.ni:hover{color:var(--nav-ink);background:rgba(255,255,255,.04)}
.ni[aria-current="page"]{background:var(--nav-2);color:var(--nav-ink);font-weight:600}
.ni[aria-current="page"] svg{color:var(--accent)}
.nav .grow{flex:1}
.user{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:none;border:0;color:var(--nav-ink);width:100%;text-align:left;margin-top:12px}
.user:hover{background:var(--nav-2)}
.user .cap{color:var(--nav-muted)}
.proto{font-size:11px;color:var(--nav-muted);padding:8px 10px 0}
.av{width:32px;height:32px;border-radius:50%;background:var(--p3);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .mlogo{display:none;align-items:center;gap:8px;min-width:0}
.gchip{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600;min-width:0;max-width:52vw}
.gchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:min(340px,100%);color:var(--muted)}
.search input{border:0;background:none;outline:none;font:inherit;color:var(--ink);width:100%;min-width:0}
.top-r{display:flex;align-items:center;gap:10px;position:relative}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:18px;height:18px}
.dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.avbtn{display:flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--muted)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 340px;flex:1;min-height:0}
.center{min-width:0;padding-block:28px 56px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;gap:20px}
.right{background:var(--surface);border-left:1px solid var(--line);padding:24px 24px 56px;display:flex;flex-direction:column;gap:26px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--brand);color:var(--on-brand);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost{background:none;color:var(--brand);padding-inline:8px}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.danger{background:var(--bad);color:#fff}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--brand);background:none;border:0;padding:0;text-decoration:none}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-neu{background:var(--subtle);color:var(--muted)} .b-brand{background:var(--brand-soft);color:var(--brand)} .b-info{background:var(--info-soft);color:var(--info)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓"}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px 9px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
.bar{height:6px;border-radius:3px;background:var(--subtle);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.ibox{width:32px;height:32px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.ibox svg{width:16px;height:16px}
.mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:800;border:0;padding:0}
.mk.ok{background:var(--ok);color:#fff} .mk.prog{background:var(--warn-soft);color:var(--warn)} .mk.miss{background:var(--bad-soft);color:var(--bad)}
.note{display:flex;gap:12px;padding:14px;border-radius:12px;align-items:flex-start}
.note.warn{background:var(--warn-soft)} .note.info{background:var(--brand-soft)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px}
.note.warn svg{color:var(--warn)} .note.info svg{color:var(--brand)}
.note b{display:block;font-size:14px}
.sect{display:flex;flex-direction:column;gap:10px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.chev{transition:transform .2s ease;color:var(--muted);flex:none}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:28px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.kv b{color:var(--ink);font-size:14px}
.kv.tot{border-top:1px solid var(--line);padding-top:8px;color:var(--ink);font-weight:600;font-size:14px}
.lr{display:flex;gap:12px;align-items:center;padding:10px 0}
.inp{border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;font:inherit;background:var(--surface);color:var(--ink);min-width:0;width:100%}
textarea.inp{resize:vertical;line-height:1.6}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.selw>label{font-size:12px;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.selw{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.selw select{appearance:none;-webkit-appearance:none;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;padding:8px 34px 8px 12px;width:100%}
.selw>svg{position:absolute;right:10px;bottom:11px;pointer-events:none;color:var(--muted)}
input[type=range]{accent-color:var(--brand);width:100%}
.sw{width:40px;height:22px;border-radius:99px;border:0;background:var(--line-strong);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-pressed="true"]{background:var(--brand)}
.sw[aria-pressed="true"]::after{left:21px}
.seg{align-self:flex-start;display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.dots{display:inline-flex;gap:3px;align-items:center}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}.dots i.on{background:var(--accent)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--subtle)}
.stack i{height:100%}
.gap-h{background:repeating-linear-gradient(45deg,var(--bad) 0 2px,var(--bad-soft) 2px 6px)}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px;color:var(--muted)}
td:first-child{font-size:14px;font-weight:600;color:var(--ink)}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}

/* cockpit */
.hero{background:var(--nav);color:var(--nav-ink);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:20px}
.hero .over,.hero .cap{color:var(--nav-muted)}
.hero h1{font-size:22px;margin:4px 0 2px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.metric b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.phases{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px}
.phase i{display:block;height:6px;border-radius:3px;margin-bottom:6px;opacity:.5}
.phase.now i{opacity:1;background:var(--accent)!important}
.phase b{display:block;font-size:12px;font-weight:600;color:var(--nav-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase.now b{color:var(--nav-ink)}
.edit{border:1px solid var(--nav-muted);color:var(--nav-ink);background:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);background:var(--surface);flex:none;margin-top:2px;display:grid;place-items:center;padding:0;color:var(--on-brand);font-size:11px;font-weight:800}
.cb.on{background:var(--brand);border-color:var(--brand)}
.cb.half{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.dl{display:flex;gap:12px;align-items:center;padding:8px 0}
.date{width:42px;height:46px;border-radius:10px;background:var(--subtle);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.date small{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.date b{font-size:16px}
.mini-g{display:grid;grid-template-columns:110px minmax(0,1fr);row-gap:6px;align-items:center}
.trk{position:relative;height:20px;background:repeating-linear-gradient(90deg,var(--subtle) 0 1px,transparent 1px var(--tick,12%))}
.trk i{position:absolute;top:4px;height:12px;border-radius:4px}
.axis{position:relative;height:16px}
.axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);z-index:2}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.score{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.score b{font-size:28px;font-weight:800;line-height:1}
.score small{font-size:12px;color:var(--muted);font-weight:500}
.drv{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.drv svg{width:16px;height:16px;flex:none;margin-top:1px}
.bigv{font-size:24px;font-weight:800;color:var(--brand);line-height:1.2}

/* roadmap */
.gwrap{overflow-x:auto;position:relative}
.gantt{min-width:720px;position:relative}
.g-axis,.g-row{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:center}
.g-axis{padding-bottom:6px}
.g-ph{display:flex;align-items:center;gap:8px;padding:14px 0 6px 8px}
.g-ph i{width:10px;height:10px;border-radius:50%}
.g-row{min-height:42px;border-radius:8px;background:none;border:0;padding:0;text-align:left;width:100%}
.g-row:hover{background:var(--subtle)}
.g-row[aria-expanded="true"]{background:var(--brand-soft)}
.g-lab{display:flex;align-items:center;gap:8px;padding:0 8px;min-width:0}
.g-lab .t{min-width:0}
.g-lab .t b,.g-lab .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-lab .t b{font-size:12px;font-weight:600}
.g-lab .t span{font-size:12px;color:var(--muted)}
.num-c{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.g-trk{position:relative;height:42px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px var(--tick,12%))}
.g-bar{position:absolute;top:9px;height:24px;border-radius:6px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap;overflow:hidden;min-width:8px}
.g-bar.opt{background:transparent!important;border:1.5px dashed currentColor}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.g-today span{position:absolute;top:-2px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
.g-det{position:sticky;left:0;width:var(--gw,100%);margin:4px 0 12px;background:var(--surface);border:1px solid var(--brand);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px;z-index:3}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.opt-r{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%;align-items:flex-start}
.opt-r[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;margin-top:2px;display:grid;place-items:center}
.opt-r[aria-checked="true"] .radio{border-color:var(--brand)}
.opt-r[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
